<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles/fonts.css">
    <link rel="stylesheet" href="styles/style.css">
    <title>Flower Shop</title>
</head>
<body>
    <main class="main">
        <section class="login">
            <div class="login__content">
                <div class="login__info">
                    <div class="login__top">
                        <h2 class="login__title">Register</h2>
                        <a href="index.html" class="back-to-home"><img src="./images/home.svg" alt="">Back to home</a>
                    </div>

                    <p class="login__desc">Register and help us help you</p>

                    <form action="/" class="login__form">
                        <input type="email" class="login__input login__email-input" placeholder="Email" required>
                        <input type="text" class="login__input login__username-input" placeholder="Username" required>
                        <input type="password" class="login__input login__password-input" placeholder="Password" required>
                        <span class="register__privacy-text">With registering your accepting our <a href="/" class="register__privacy-link">terms and privacy policy</a></span>
                        <button type="submit" class="login__button">Register</button>
                    </form>

                    <span class="login__register-text">Already have an account?<a href="login.html" class="login__register-link"> Login</a></span>
                </div>

                <img src="./images/register.png" alt="">
            </div>
        </section>
    </main>
</body>
</html>
