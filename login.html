<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles/fonts.css">
    <link rel="stylesheet" href="styles/style.css">
    <title>Flower Shop</title>
</head>
<body>
    <main class="main">
        <section class="login">
            <div class="login__content">
                <div class="login__info">
                    <div class="login__top">
                        <h2 class="login__title">Login</h2>
                        <a href="/" class="back-to-home"><img src="./images/home.svg" alt="">Back to home</a>
                    </div>

                    <p class="login__desc">Login and have more fun</p>

                    <form action="/" class="login__form">
                        <input type="text" class="login__input login__username-input" placeholder="Username" required>
                        <input type="password" class="login__input login__password-input" placeholder="Password" required>
                        <label class="login__checkbox"><input type="checkbox" class="login__input-chekbox">Remember me</label>
                        <button type="submit" class="login__button">Login</button>
                    </form>

                    <span class="login__register-text">Don't have an account?<a href="register.html" class="login__register-link"> Register</a></span>
                </div>

                <img src="./images/login.png" alt="">
            </div>
        </section>
    </main>
</body>
</html>
